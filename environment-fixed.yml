name: many-stats
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.20.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - numba>=0.56.0
  - xarray>=2023.1.0  # Ensure compatibility with sgkit
  - dask>=2021.0.0
  - zarr>=2.10.0
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - jupyter
  - pytest>=6.0
  - black
  - flake8
  - mypy
  - pip
  - pip:
    - sgkit>=0.10.0
    - bio2zarr>=0.1.6



